name: Bug report
description: Something in CleanMate doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. In CleanMate, **Help › Report a Bug…** fills in **System details** for you.
        Please don't paste file paths or anything personal.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Smart Scan
        2. Click Scan
        3. …
  - type: textarea
    id: system
    attributes:
      label: System details
      description: CleanMate version, macOS version, Mac chip, Full Disk Access and recent activity. Filled in by Help › Report a Bug…
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or other details that help.
